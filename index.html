<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jízdní doby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="app">
<aside class="side">
<header class="head">
<div class="brand">JÍZDNÍ DOBY<i></i></div>
<div class="sub">Vývoj jízdních dob pražských tramvají</div>
<div class="tabs">
<button class="on" data-view="changes">Změny</button>
<button data-view="current">Aktuální JD</button>
<button data-view="history">Historie úseku</button>
</div>
</header>
<section class="body" id="panel"></section>
<footer class="statusbox">
<button class="statusline" id="statusLine"><span class="dot" id="statusDot"></span><span id="statusText">Načítám stav dat…</span></button>
<div class="statusdetail" id="statusDetail" hidden></div>
</footer>
</aside>
<section class="mapwrap">
<div id="map" class="map"></div>
<div class="mapmode"><button class="on" data-mode="changes">Změny</button><button data-mode="current">Aktuální JD</button></div>
<div class="legend" id="legend"></div>
</section>
</main>
<nav class="mobileNav">
<button class="on" data-mobile="changes">Změny</button>
<button data-mobile="map">Mapa</button>
<button data-mobile="current">Aktuální</button>
<button data-mobile="history">Historie</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
