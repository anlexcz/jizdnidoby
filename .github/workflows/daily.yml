name: Denní aktualizace

on:
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Otestovat detektor
        run: python -m unittest discover -s tests -v
      - name: Stáhnout předchozí stav
        run: |
          mkdir -p data/state
          gh release download state --pattern "state.csv.gz" --pattern "meta.json" --dir data/state --clobber || echo "Základní stav zatím neexistuje."
          gh release download state --pattern "trip_state.csv.gz" --dir data/state --clobber || echo "Trip state zatím neexistuje."
          # Starší release mohl mít meta+state bez trip_state. Vynutíme jeden bezpečný
          # přepočet; bez předchozího trip_state se při něm změny JD nedetekují.
          if [ -f data/state/meta.json ] && [ ! -f data/state/trip_state.csv.gz ]; then
            echo "Bootstrap trip_state: vynucuji přepočet feedu."
            rm data/state/meta.json
          fi
      - name: Spočítat, zkontrolovat a porovnat
        run: python daily_update_v3.py
      - name: Uložit nový stav
        run: |
          test -f data/state/state.csv.gz
          test -f data/state/trip_state.csv.gz
          test -f data/state/meta.json
          gh release view state >/dev/null 2>&1 || gh release create state --title "state" --notes "Interní stav pro denní porovnávání, needitovat." --latest=false
          gh release upload state data/state/state.csv.gz data/state/trip_state.csv.gz data/state/meta.json --clobber
      - name: Commit výsledků
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for p in data/changes.csv data/evidence.csv data/shape_log.csv data/shapes data/web; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Žádné změny k uložení."
          else
            git commit -m "Data $(date -u +%F)"
            git push
          fi
