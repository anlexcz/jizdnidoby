name: Denní aktualizace

on:
  schedule:
    # Primární běh + záložní běh. GitHub scheduled Actions nejsou garantované
    # na minutu přesně a jednotlivý cron může být výjimečně vynechán.
    - cron: "37 4 * * *"
    - cron: "07 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "*.py"
      - ".github/workflows/daily.yml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Závislosti
        run: pip install -r requirements.txt

      - name: Testy
        run: python -m unittest discover -s tests -v

      - name: Stáhnout předchozí stav
        run: |
          mkdir -p data/state
          gh release download state --pattern "state.csv.gz" --pattern "meta.json" --dir data/state --clobber || echo "Základní stav zatím neexistuje."
          gh release download state --pattern "trip_state.csv.gz" --dir data/state --clobber || echo "Trip state zatím neexistuje."
          if [ -f data/state/meta.json ] && [ ! -f data/state/trip_state.csv.gz ]; then
            echo "Bootstrap trip_state: vynucuji bezpečný přepočet feedu bez detekce JD."
            rm data/state/meta.json
          fi

      - name: Spočítat, zkontrolovat a porovnat
        run: python daily_update.py

      - name: Připravit webové geometrie
        run: python split_segments.py

      - name: Ověřit nový stav a webová data
        run: python validate_build.py

      - name: Zapsat úspěšné načtení
        run: |
          day=$(date -u +%F)
          if [ ! -f data/run_log.csv ]; then echo "date" > data/run_log.csv; fi
          grep -qx "$day" data/run_log.csv || echo "$day" >> data/run_log.csv
          python export_status.py
          python validate_build.py

      - name: Uložit nový pracovní stav
        run: |
          gh release view state >/dev/null 2>&1 || gh release create state --title "state" --notes "Interní stav pro denní porovnávání, needitovat." --latest=false
          gh release upload state data/state/state.csv.gz data/state/trip_state.csv.gz data/state/meta.json --clobber

      - name: Commit výsledků
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for p in data/changes.csv data/evidence.csv data/shape_log.csv data/shapes data/web data/run_log.csv; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Žádné změny k uložení."
          else
            git commit -m "Data $(date -u +%F)"
            # Výpočet může trvat několik minut a během něj se může main posunout
            # např. frontendovým commitem. Datový commit proto před pushnutím
            # bezpečně přehrajeme nad nejnovější main místo non-fast-forward pádu.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push se mezitím znovu střetl s novým commitem; pokus $attempt/3."
            done
            echo "Datový commit se nepodařilo bezpečně pushnout po 3 pokusech."
            exit 1
          fi
