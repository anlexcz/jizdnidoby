name: Denní aktualizace

on:
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Stáhnout předchozí stav
        run: |
          mkdir -p data/state
          gh release download state --pattern "state.csv.gz" --pattern "meta.json" --dir data/state --clobber || echo "Předchozí stav neexistuje (první běh)."

      - name: Spočítat a porovnat
        run: python daily_update.py

      - name: Uložit nový stav
        run: |
          gh release view state >/dev/null 2>&1 || gh release create state --title "state" --notes "Interní stav pro denní porovnávání, needitovat." --latest=false
          gh release upload state data/state/state.csv.gz data/state/meta.json --clobber

      - name: Commit výsledků
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for p in data/changes.csv data/shape_log.csv data/shapes; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Žádné změny k uložení."
          else
            git commit -m "Data $(date -u +%F)"
            git push
          fi
