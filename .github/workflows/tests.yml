name: Testy

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile daily_update.py export_web.py export_status.py validate_build.py split_segments.py change_events.py feed_quality.py shape_geometry.py time_regimes.py tram_segments.py
      - name: Backend tests
        run: python -m unittest discover -s tests -v
      - name: Frontend syntax
        run: node --check app.js
